overlay: 1.0.0
info:
  title: Moneybird API Authentication Profile
  version: 1.0.0
# Moneybird accepts either a personal API token or an OAuth 2.0 access token.
# Both are sent as a bearer token. The integration proxy may mint the OAuth
# token; deployments can also provide a personal token for local use.
actions:
  - target: $.components.securitySchemes
    update:
      moneybirdToken:
        type: http
        scheme: bearer
        description: >
          Moneybird personal API token or OAuth 2.0 access token, sent as
          Authorization: Bearer. OAuth applications may request sales_invoices,
          documents, estimates, bank, time_entries, or settings scopes.
